<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.slim.js"
        integrity="sha256-M+GjhMBfXikM1izMplICCTscIj5hzPCp6uDzaypxtgg=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
    <title>アンディニ誕生日</title>
</head>

<body>
    <div id="falling-stars" aria-hidden="true"></div>
    <script>
        const layer = document.querySelector('#falling-stars');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        function createStar() {
            const star = document.createElement('span');
            star.className = 'star';
            const size = 8 + Math.random() * 22;
            const duration = 3.1 + Math.random() * 2.4;
            const driftX = '0px';

            star.style.setProperty('--x', `${Math.random() * 92}vw`);
            star.style.setProperty('--size', `${size}px`);
            star.style.setProperty('--duration', `${duration}s`);
            star.style.setProperty('--drift-x', driftX);
            star.style.setProperty('--tail-speed', `${.26 + Math.random() * .3}s`);
            layer.append(star);
            star.addEventListener('animationend', () => star.remove());
        }

        var sound = new Audio("content-song.mp3");
        sound.loop = true;

        const d = new Date();
        let date = d.getDate();
        let month = d.getMonth() + 1;
        let year = d.getFullYear();
        const age_now = year - 2001;
        const month_aniversay = new Date("2026", "06", "30")
        const monthiv_now = d.getMonth() - month_aniversay.getMonth();
        const cover_sound = new Audio("cover-song.mp3");
        cover_sound.loop = true
        $(document).ready(() => {
            $("#age").html(age_now)
            $("#monthiv").html(monthiv_now)
            if (date == "28" && month == "09") {
                $("#btn_start").css("display", "block")
                $("#gommene_text").css("display", "none")
                $("#cat_happy").css("display", "block")
            } else {
                $("#btn_start").css("display", "none")
                $("#gomenne_text").css("display", "block")
                $("#cat_happy").css("display", "none")
            }
        })
        function submit() {
            let birth_date = $("#birth_date").val();
            if (birth_date == "2026-09-28") {
                cover_sound.pause()
                sound.play();
                $("#message_input").css("display", "flex")
                $("#birth_input").css("display", "none")
            } else {
                alert("すみません。入力された生年月日が間違っています 😓")
            }
        }

        function start_btn() {
            $("#container_birth_input").css("display", "flex")
            $("#btn_start").css("display", "none")
            $("#main").css("background-image", "url('sky.jpg')")
            $("#cat_happy").css("display", "none")
            cover_sound.play()
            if (!reduceMotion) {
                // One star is created at a time. The next delay is intentionally random.
                (function spawn() {
                    createStar();
                    setTimeout(spawn, 260 + Math.random() * 760);
                })();
            }
        }

    </script>
    <div class="main" id="main">
        <div id="birth_input" class="birth_input">
            <div id="container_birth_input" style="display: none;flex-direction: column;">
                <img src="giphy.gif" alt="totoro" height="150px"
                    style="align-self: center; margin-bottom: 15px;border-radius: 20px;">
                <label for="birth_date">生年月日を入力してください</label>
                <input type="date" id="birth_date" name="birth_date"
                    style="margin: 10px 0; border-radius: 2px; border:1px solid black; padding: 5px;">
                <button class="btn-minimal" onclick="submit()">送信する</button>
            </div>
            <img id="cat_happy" src="cat_hp.gif" alt="Cat_Happy"
                style="display: none;border-radius: 20px;">
            <button id="btn_start" class="btn-minimal-off" onclick="start_btn()" style="display: none;">押してください</button>
            <span id="gomenne_text" style="display: none;">ごめん、まだ9月30日じゃないよ 😓</span>
        </div>
        <div id="message_input" class="message_input">
            <div class="header">
                <h2 style="margin:0;padding:5px">アンディニさん、お誕生日おめでとうございます！</h2>
                <span style="margin:15px;font-size:20px">💖 🥳 🎉 🎊 🎂 💖</span>
            </div>
            <iframe src="https://drive.google.com/file/d/1IEM0u1CtLYrKSvcMBXxt1_tchFzWY6GV/preview?autoplay=1" width="380" height="380" allow="autoplay">
            </iframe>
            <div class="footer">
                <div style="padding:0 20px">Happy <span id="age"></span>th birthday
                    and happy <span id="monthiv"></span>nd monthiversary my love 💕. <br>
                    I hope you’ll always be happy, successful, healthy, and able to achieve all your dreams.
                </div>
                <div style="font-weight: bold;margin-top: 5px;">Aminnn... 🤲😇</div>
                <div style="color:white;display: flex;justify-content: center;margin-top: 20px;">
                    ~ Make with 💖 by Rafael.C.S
                </div>
            </div>
        </div>
    </div>
</body>

</html>
